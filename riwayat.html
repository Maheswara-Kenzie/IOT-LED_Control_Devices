<!DOCTYPE html>
<html class="dark" lang="id"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Verisium - Riwayat</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script src="js/tailwind-config.js"></script>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet"/>
<link href="css/base.css" rel="stylesheet"/>
<link href="css/glow.css" rel="stylesheet"/>
</head>
<body class="min-h-screen flex flex-col justify-between selection:bg-sky-500/30 selection:text-sky-300" data-page="riwayat">

<div id="app-header"></div>

<main class="flex-1 max-w-md w-full mx-auto p-4 space-y-4">
  <div class="space-y-4" id="app-tabs"></div>

  <!-- ============ HALAMAN: RIWAYAT ============ -->
  <section class="space-y-4">
    <div class="bg-[#0f131c] rounded-xl border border-[#242b3d] p-4 space-y-3">
      <div class="flex items-center justify-between">
        <div class="flex items-center space-x-2">
          <svg class="w-4 h-4 text-sky-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"/></svg>
          <span class="text-xs font-bold text-white uppercase tracking-wider">Ringkasan Riwayat</span>
        </div>
        <span class="text-[10px] font-mono text-emerald-400 bg-emerald-950/60 border border-emerald-800/40 px-2 py-0.5 rounded flex items-center space-x-1">
          <span class="w-1.5 h-1.5 rounded-full bg-emerald-400"></span><span>SINKRON</span>
        </span>
      </div>
      <div class="grid grid-cols-3 gap-2 pt-1 font-mono">
        <div class="bg-[#131824] p-2.5 rounded-lg border border-[#242b3d]">
          <div class="text-[10px] text-slate-400">TOTAL AKSI</div>
          <div class="text-lg font-bold text-white mt-0.5" id="h-total">0</div>
          <div class="text-[10px] text-slate-400">di buffer board</div>
        </div>
        <div class="bg-[#131824] p-2.5 rounded-lg border border-[#242b3d]">
          <div class="text-[10px] text-slate-400">DURASI MENYALA</div>
          <div class="text-lg font-bold text-sky-400 mt-0.5" id="h-dur">0d</div>
          <div class="text-[10px] text-slate-400">Akumulatif</div>
        </div>
        <div class="bg-[#131824] p-2.5 rounded-lg border border-[#242b3d]">
          <div class="text-[10px] text-slate-400">AKSI TERAKHIR</div>
          <div class="text-lg font-bold text-amber-400 mt-0.5" id="h-last">-</div>
          <div class="text-[10px] text-slate-400" id="h-last-sub">-</div>
        </div>
      </div>
      <div class="flex items-center justify-between pt-1">
        <div class="flex space-x-2">
          <button class="px-2.5 py-1 rounded bg-[#181c24] hover:bg-[#202636] border border-[#242b3d] text-slate-300 text-xs font-mono flex items-center space-x-1 transition" onclick="Riwayat.exportCsv()">
            <svg class="w-3.5 h-3.5 text-sky-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"/></svg>
            <span>Ekspor CSV</span>
          </button>
          <button class="px-2.5 py-1 rounded bg-[#181c24] hover:bg-rose-950/30 border border-[#242b3d] hover:border-rose-800/40 text-slate-300 text-xs font-mono flex items-center space-x-1 transition" onclick="Riwayat.clear()">
            <svg class="w-3.5 h-3.5 text-rose-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"/></svg>
            <span>Bersihkan</span>
          </button>
        </div>
        <span class="text-[10px] font-mono text-slate-400" id="h-shown">0 Entri Ditampilkan</span>
      </div>
    </div>

    <div class="flex items-center space-x-1.5 overflow-x-auto py-0.5 text-xs font-mono" id="h-filters">
      <button class="px-3 py-1 rounded-full bg-sky-400 text-slate-950 font-bold shrink-0" data-f="all" onclick="Riwayat.setFilter('all')">Semua</button>
      <button class="px-3 py-1 rounded-full bg-[#0f131c] text-rose-300 border border-rose-800/30 shrink-0 hover:bg-[#181c24]" data-f="merah" onclick="Riwayat.setFilter('merah')">● Lampu Merah</button>
      <button class="px-3 py-1 rounded-full bg-[#0f131c] text-amber-300 border border-amber-800/30 shrink-0 hover:bg-[#181c24]" data-f="kuning" onclick="Riwayat.setFilter('kuning')">● Lampu Kuning</button>
      <button class="px-3 py-1 rounded-full bg-[#0f131c] text-emerald-300 border border-emerald-800/30 shrink-0 hover:bg-[#181c24]" data-f="hijau" onclick="Riwayat.setFilter('hijau')">● Lampu Hijau</button>
    </div>

    <div class="space-y-2">
      <div class="text-[11px] font-mono text-slate-400 px-1 flex items-center justify-between">
        <span id="h-date">RIWAYAT</span><span id="h-count">0 Peristiwa</span>
      </div>
      <div class="space-y-1.5 font-mono text-xs" id="h-list"></div>
      <div class="bg-[#0f131c] rounded-xl border border-[#242b3d] p-3 flex items-center justify-between text-xs font-mono text-slate-400 mt-3">
        <div class="flex items-center space-x-2">
          <svg class="w-4 h-4 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M4 7v10c0 2.21 3.582 4 8 4s8-1.79 8-4V7M4 7c0 2.21 3.582 4 8 4s8-1.79 8-4M4 7c0-2.21 3.582-4 8-4s8 1.79 8 4m0 5c0 2.21-3.582 4-8 4s-8-1.79-8-4" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"/></svg>
          <span id="h-buf">Buffer Riwayat: 0/40 entri</span>
        </div>
        <span class="text-emerald-400">NORMAL</span>
      </div>
    </div>
  </section>
</main>

<div id="app-nav"></div>

<script src="js/config.js"></script>
<script src="js/ui.js"></script>
<script src="js/api.js"></script>
<script src="js/layout.js"></script>
<script src="js/pages/riwayat.js"></script>
<script src="js/boot.js"></script>
</body></html>
