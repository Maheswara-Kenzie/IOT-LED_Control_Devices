<!DOCTYPE html>
<html class="dark" lang="id"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Verisium - Saklar</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script src="js/tailwind-config.js"></script>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet"/>
<link href="css/base.css" rel="stylesheet"/>
<link href="css/glow.css" rel="stylesheet"/>
</head>
<body class="min-h-screen flex flex-col justify-between selection:bg-sky-500/30 selection:text-sky-300" data-page="saklar">

<div id="app-header"></div>

<main class="flex-1 max-w-md w-full mx-auto p-4 space-y-4">
  <div class="space-y-4" id="app-tabs"></div>

  <!-- ============ HALAMAN: SAKLAR ============ -->
  <section class="space-y-4">
    <div class="bg-[#0f131c] rounded-xl border border-[#242b3d] p-4 flex items-center justify-between">
      <div>
        <div class="flex items-center space-x-2">
          <svg class="w-4 h-4 text-amber-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M13 10V3L4 14h7v7l9-11h-7z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"/></svg>
          <span class="text-sm font-bold text-white">3 Lampu Terpasang</span>
        </div>
        <p class="text-xs text-slate-400 mt-0.5">Beban: <span class="text-amber-400 font-semibold" id="active-count-label">0 dari 3 Lampu Menyala</span></p>
      </div>
      <div class="flex items-center space-x-1.5" id="dot-row"></div>
    </div>

    <div class="grid grid-cols-2 gap-2">
      <button class="py-2.5 px-3 rounded-lg bg-emerald-950/40 hover:bg-emerald-900/40 border border-emerald-800/50 text-emerald-300 text-xs font-bold flex items-center justify-center space-x-1.5 transition active:scale-[0.98]" onclick="Saklar.toggleAll(true)">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M13 10V3L4 14h7v7l9-11h-7z" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span>NYALAKAN SEMUA</span>
      </button>
      <button class="py-2.5 px-3 rounded-lg bg-rose-950/40 hover:bg-rose-900/40 border border-rose-800/50 text-rose-300 text-xs font-bold flex items-center justify-center space-x-1.5 transition active:scale-[0.98]" onclick="Saklar.toggleAll(false)">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M18.364 18.364A9 9 0 005.636 5.636m12.728 12.728A9 9 0 015.636 5.636m12.728 12.728L5.636 5.636" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span>MATIKAN SEMUA</span>
      </button>
    </div>

    <!-- Kartu lampu dibuat oleh js/pages/saklar.js -->
    <div class="space-y-3" id="lamp-list"></div>

    <div class="bg-[#0f131c] rounded-xl border border-sky-500/20 p-4 flex items-center justify-between transition-all duration-300" id="card-disko">
      <div class="flex items-center space-x-3">
        <div class="w-10 h-10 rounded-lg bg-slate-900 border border-[#242b3d] flex items-center justify-center text-slate-500 shrink-0 transition-all duration-300" id="icon-disko">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M13 10V3L4 14h7v7l9-11h-7z" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
        <div>
          <div class="text-xs font-bold text-white">Mode Disko / Kedip Otomatis</div>
          <div class="text-[11px] text-slate-400" id="status-disko-txt">Siklus otomatis bergantian (Off)</div>
        </div>
      </div>
      <label class="relative inline-flex items-center cursor-pointer">
        <input class="sr-only peer" id="sw-disko" type="checkbox"/>
        <div class="w-11 h-6 bg-slate-800 rounded-full peer peer-checked:after:translate-x-full after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-sky-500"></div>
      </label>
    </div>
  </section>
</main>

<div id="app-nav"></div>

<script src="js/config.js"></script>
<script src="js/ui.js"></script>
<script src="js/api.js"></script>
<script src="js/layout.js"></script>
<script src="js/pages/saklar.js"></script>
<script src="js/boot.js"></script>
</body></html>
