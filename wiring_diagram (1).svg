<svg xmlns="http://www.w3.org/2000/svg" width="720" height="430" viewBox="0 0 720 430" font-family="Arial, Helvetica, sans-serif">
  <title>Diagram wiring ESP8266 ke 3 LED</title>
  <desc>D1, D2, dan D5 NodeMCU ESP8266 terhubung lewat resistor 220 ohm ke LED merah, kuning, dan hijau, lalu ke jalur GND bersama.</desc>
  <rect width="720" height="430" rx="12" fill="#ffffff"/>

  <rect x="40" y="40" width="190" height="330" rx="12" fill="#E1F5EE" stroke="#0F6E56" stroke-width="2"/>
  <text x="135" y="68" text-anchor="middle" font-size="15" font-weight="bold" fill="#085041">NodeMCU ESP8266</text>
  <text x="135" y="88" text-anchor="middle" font-size="12" fill="#0F6E56">dilihat dari sisi pin</text>

  <text x="216" y="115" text-anchor="end" font-size="13" fill="#085041">D1 (GPIO5)</text>
  <text x="216" y="195" text-anchor="end" font-size="13" fill="#085041">D2 (GPIO4)</text>
  <text x="216" y="275" text-anchor="end" font-size="13" fill="#085041">D5 (GPIO14)</text>
  <text x="216" y="345" text-anchor="end" font-size="13" fill="#085041">GND</text>

  <circle cx="230" cy="110" r="5" fill="#0F6E56"/>
  <circle cx="230" cy="190" r="5" fill="#0F6E56"/>
  <circle cx="230" cy="270" r="5" fill="#0F6E56"/>
  <circle cx="230" cy="340" r="5" fill="#444441"/>

  <g stroke-width="2.5" fill="none" stroke-linecap="round">
    <path d="M235 110 H290" stroke="#185FA5"/>
    <path d="M350 110 H414" stroke="#185FA5"/>
    <path d="M446 110 H600" stroke="#5F5E5A"/>

    <path d="M235 190 H290" stroke="#185FA5"/>
    <path d="M350 190 H414" stroke="#185FA5"/>
    <path d="M446 190 H600" stroke="#5F5E5A"/>

    <path d="M235 270 H290" stroke="#185FA5"/>
    <path d="M350 270 H414" stroke="#185FA5"/>
    <path d="M446 270 H600" stroke="#5F5E5A"/>

    <path d="M235 340 H600" stroke="#5F5E5A"/>
    <path d="M600 110 V340" stroke="#5F5E5A"/>
  </g>

  <g fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.5">
    <rect x="290" y="97" width="60" height="26" rx="4"/>
    <rect x="290" y="177" width="60" height="26" rx="4"/>
    <rect x="290" y="257" width="60" height="26" rx="4"/>
  </g>
  <g text-anchor="middle" font-size="12" fill="#2C2C2A">
    <text x="320" y="114">220Ω</text>
    <text x="320" y="194">220Ω</text>
    <text x="320" y="274">220Ω</text>
  </g>

  <circle cx="430" cy="110" r="16" fill="#E24B4A" stroke="#A32D2D" stroke-width="2"/>
  <circle cx="430" cy="190" r="16" fill="#EF9F27" stroke="#854F0B" stroke-width="2"/>
  <circle cx="430" cy="270" r="16" fill="#639922" stroke="#3B6D11" stroke-width="2"/>
  <g text-anchor="middle" font-size="13" fill="#2C2C2A">
    <text x="430" y="82">LED merah</text>
    <text x="430" y="162">LED kuning</text>
    <text x="430" y="242">LED hijau</text>
  </g>

  <g fill="#5F5E5A">
    <circle cx="600" cy="110" r="4"/>
    <circle cx="600" cy="190" r="4"/>
    <circle cx="600" cy="270" r="4"/>
    <circle cx="600" cy="340" r="4"/>
  </g>
  <text x="414" y="332" text-anchor="middle" font-size="12" fill="#444441">Jalur GND bersama</text>
  <text x="612" y="228" font-size="12" fill="#444441">GND</text>

  <text x="40" y="402" font-size="12" fill="#444441">Kaki panjang LED (anoda) menghadap resistor. Kaki pendek (katoda) ke jalur GND.</text>
  <text x="40" y="420" font-size="12" fill="#444441">Semua GND harus tersambung jadi satu dengan GND ESP8266.</text>
</svg>
